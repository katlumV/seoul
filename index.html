<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="seoul">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>seoul</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1a1a1a;--mute:#777;--acc:#e4572e;--line:#e3e1dc}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--fg:#eee;--mute:#999;--line:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;
 padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:480px;margin:0 auto}
h1{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.date{color:var(--mute);font-size:14px}
.pick{font-size:34px;font-weight:700;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.main{background:var(--fg);color:var(--bg);border:0;width:100%;padding:12px;font-weight:600;margin-top:12px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 6px}
input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent}
.stars button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500}
.ok{color:var(--acc);font-size:14px;margin-top:8px;min-height:1em}
details summary{color:var(--mute);font-size:14px}
textarea{width:100%;height:90px;margin-top:8px;font:12px monospace;background:transparent;color:inherit;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<main>
<h1>seoul</h1>

<div class="card">
  <div class="date" id="date"></div>
  <div class="pick" id="pick"></div>
  <div class="row" id="swap"></div>
</div>

<div class="card">
  <strong>End of day</strong>
  <label for="min">Minutes played</label>
  <input id="min" type="number" inputmode="numeric" min="0" placeholder="0">
  <label>Satisfaction</label>
  <div class="row stars" id="stars"></div>
  <button class="main" id="save">Save today</button>
  <div class="ok" id="ok"></div>
</div>

<div class="card">
  <strong>Stats</strong>
  <table id="stats"></table>
</div>

<div class="card">
  <strong>History</strong>
  <table id="hist"></table>
</div>

<div class="card">
  <details>
    <summary>Backup / restore</summary>
    <div class="row" style="margin-top:8px">
      <button id="exp">Copy backup</button>
      <button id="imp">Restore from box</button>
    </div>
    <textarea id="box" placeholder="Paste backup JSON here to restore"></textarea>
  </details>
</div>
</main>

<script>
const CONSOLES = ["Switch Lite", "Switch 1", "Steam Deck", "DSi"];
const KEY = "seoul.v1";
const $ = id => document.getElementById(id);

// data shape: { days: { "YYYY-MM-DD": { console, minutes?, score? } } }
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || { days: {} }; } catch { db = { days: {} }; }
const persist = () => localStorage.setItem(KEY, JSON.stringify(db));

const ymd = d => d.toLocaleDateString("en-CA"); // local YYYY-MM-DD
const today = ymd(new Date());
const yesterday = ymd(new Date(Date.now() - 864e5));

// Per-console stats from logged days
function stats() {
  const s = {};
  CONSOLES.forEach(c => s[c] = { days: 0, mins: 0, scoreSum: 0, scored: 0 });
  Object.values(db.days).forEach(d => {
    const x = s[d.console]; if (!x || d.minutes == null) return;
    x.days++; x.mins += d.minutes;
    if (d.score) { x.scoreSum += d.score; x.scored++; }
  });
  return s;
}

// Today's pick: weighted random, stable for the day (seeded by date).
// Weight = average satisfaction (3 if unrated), squared so favorites show up more.
// Yesterday's console is skipped so it rotates.
function choose() {
  const s = stats();
  const last = db.days[yesterday]?.console;
  const pool = CONSOLES.filter(c => c !== last);
  const w = pool.map(c => { const x = s[c]; const avg = x.scored ? x.scoreSum / x.scored : 3; return avg * avg; });
  let seed = [...today].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  seed = (seed * 1103515245 + 12345) >>> 0;
  let r = (seed / 2 ** 32) * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { if ((r -= w[i]) < 0) return pool[i]; }
  return pool[0];
}

if (!db.days[today]) { db.days[today] = { console: choose() }; persist(); }

let score = db.days[today].score || 0;

function render() {
  const t = db.days[today];
  $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  $("pick").textContent = t.console;

  $("swap").innerHTML = "";
  CONSOLES.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c; if (c === t.console) b.className = "on";
    b.onclick = () => { t.console = c; persist(); render(); };
    $("swap").append(b);
  });

  $("min").value = t.minutes ?? "";
  $("stars").innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.textContent = i; if (i === score) b.className = "on";
    b.onclick = () => { score = i; render(); };
    $("stars").append(b);
  }

  const s = stats();
  $("stats").innerHTML = "<tr><th>Console</th><th>Days</th><th>Minutes</th><th>Avg ★</th></tr>" +
    CONSOLES.map(c => { const x = s[c];
      return `<tr><td>${c}</td><td>${x.days}</td><td>${x.mins}</td><td>${x.scored ? (x.scoreSum / x.scored).toFixed(1) : "–"}</td></tr>`;
    }).join("");

  const rows = Object.entries(db.days).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 30);
  $("hist").innerHTML = "<tr><th>Date</th><th>Console</th><th>Min</th><th>★</th></tr>" +
    rows.map(([d, x]) => `<tr><td>${d.slice(5)}</td><td>${x.console}</td><td>${x.minutes ?? "–"}</td><td>${x.score ?? "–"}</td></tr>`).join("");
}

$("save").onclick = () => {
  const m = parseInt($("min").value, 10);
  if (isNaN(m) || m < 0) { $("ok").textContent = "Enter minutes first"; return; }
  if (!score) { $("ok").textContent = "Pick a satisfaction score"; return; }
  Object.assign(db.days[today], { minutes: m, score });
  persist(); render(); $("ok").textContent = "Saved ✓";
};

$("exp").onclick = async () => {
  const txt = JSON.stringify(db);
  $("box").value = txt;
  try { await navigator.clipboard.writeText(txt); $("ok").textContent = "Backup copied to clipboard"; } catch {}
};
$("imp").onclick = () => {
  try {
    const d = JSON.parse($("box").value);
    if (!d.days) throw 0;
    if (!confirm("Replace all current data with this backup?")) return;
    db = d; persist(); score = db.days[today]?.score || 0;
    if (!db.days[today]) { db.days[today] = { console: choose() }; persist(); }
    render(); alert("Restored");
  } catch { alert("That doesn't look like a seoul backup"); }
};

render();
</script>
</body>
</html>
